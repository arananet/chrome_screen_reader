<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fff;
      color: #1f2937;
    }
    .popup-header {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      padding: 16px;
      text-align: center;
    }
    .popup-header h1 { font-size: 15px; font-weight: 600; }
    .popup-header p { font-size: 11px; opacity: 0.85; margin-top: 4px; }
    .popup-body { padding: 16px; }
    .popup-body p { font-size: 13px; color: #4b5563; margin-bottom: 12px; line-height: 1.5; }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: opacity 0.15s;
      font-family: inherit;
      margin-bottom: 8px;
    }
    .btn:hover { opacity: 0.9; }
    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
    }
    .btn-secondary {
      background: #f3f4f6;
      color: #4b5563;
      border: 1px solid #e5e7eb;
    }
    .shortcut {
      text-align: center;
      font-size: 11px;
      color: #9ca3af;
      margin-top: 4px;
    }
    .shortcut kbd {
      background: #f3f4f6;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #e5e7eb;
      font-size: 10px;
    }
    .status-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
      margin-bottom: 12px;
    }
    .status-badge.configured { background: #d1fae5; color: #065f46; }
    .status-badge.not-configured { background: #fef3c7; color: #92400e; }
    .popup-footer {
      padding: 10px 16px;
      border-top: 1px solid #f3f4f6;
      text-align: center;
      font-size: 10px;
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="popup-header">
    <h1>&#x1F50D; Screen Analyzer</h1>
    <p>AI-powered screen analysis</p>
  </div>
  <div class="popup-body">
    <div id="apiStatus"></div>
    <p>Capture the current page and analyze it with Claude AI for SEO, content, and document insights.</p>
    <button class="btn btn-primary" id="openPanel">Open Analyzer Panel</button>
    <button class="btn btn-secondary" id="openSettings">Settings</button>
    <div class="shortcut">
      Shortcut: <kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>A</kbd>
    </div>
  </div>
  <div class="popup-footer">
    By Eduardo Arana &amp; Soda &#x1F964; &mdash; MIT License
  </div>
  <script src="popup.js"></script>
</body>
</html>
